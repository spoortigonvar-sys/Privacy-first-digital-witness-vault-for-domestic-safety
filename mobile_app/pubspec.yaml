name: digital_witness_vault
description: Digital Witness Vault - Secure Evidence Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.1
  http_parser: ^4.0.2

  # File picking
  file_picker: ^8.0.3

  # Camera recording (mobile equivalent of the website's getUserMedia/MediaRecorder recorder.html)
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # Keeps the screen awake while a stealth recording is active, so an
  # idle-timeout screen-off doesn't background the app (and with it, the
  # camera) mid-recording. No special permissions required on Android.
  wakelock_plus: ^1.3.0

  # Shared preferences (local storage / session)
  shared_preferences: ^2.2.3

  # Video player
  video_player: ^2.8.6
  chewie: ^1.7.4

  # Icons
  cupertino_icons: ^1.0.6

  # Intl for date formatting
  intl: ^0.19.0

  # Path provider
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Generates the mipmap launcher icons in every required density from a
  # single source image. Run `flutter pub run flutter_launcher_icons`
  # locally after dropping a calculator-style square PNG (min 512x512,
  # no transparency needed) at the path below — I can't generate the
  # actual icon image or run this tool from this sandbox (no Flutter
  # toolchain here). Until then, the launcher icon is still the default
  # Flutter icon, even though the label now correctly reads "Calculator".
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
