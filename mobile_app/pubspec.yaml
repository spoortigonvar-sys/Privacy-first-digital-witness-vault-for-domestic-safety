name: digital_witness_vault
description: Digital Witness Vault - Secure Evidence Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.1
  http_parser: ^4.0.2

  # File picking
  file_picker: ^8.0.3

  # Camera recording (mobile equivalent of the website's getUserMedia/MediaRecorder recorder.html)
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # Shared preferences (local storage / session)
  shared_preferences: ^2.2.3

  # Video player
  video_player: ^2.8.6
  chewie: ^1.7.4

  # Icons
  cupertino_icons: ^1.0.6

  # Intl for date formatting
  intl: ^0.19.0

  # Path provider
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
